# Tiny Tapeout project information
project:
  title:        "Hardware Regex Matcher"      # Project title
  author:       "Noel Jose, Tinu P Mathew, Joseph Sathosh K"      # Your name
  discord:      "noeljose1290"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Hardware NFA that streams 8-bit ASCII characters to match [a-z]+@[a-z]+\\.com"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_regex_matcher"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_regex_matcher.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "ascii_in_0"
  ui[1]: "ascii_in_1"
  ui[2]: "ascii_in_2"
  ui[3]: "ascii_in_3"
  ui[4]: "ascii_in_4"
  ui[5]: "ascii_in_5"
  ui[6]: "ascii_in_6"
  ui[7]: "ascii_in_7"

  # Outputs
  uo[0]: "match"
  uo[1]: "debug_s_az1"
  uo[2]: "debug_s_at"
  uo[3]: "debug_s_az2"
  uo[4]: "debug_s_dot"
  uo[5]: "debug_s_c"
  uo[6]: "debug_s_o"
  uo[7]: "unused"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
